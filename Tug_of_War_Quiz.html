<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tug of War Quiz – Data Types and Excel Basics</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f9f6;--card:#fff;--fg:#1b2b24;--mu:#5c6f66;--dk:#0f2a22;--gd:#f2c811;--ln:#c9dcd1;--a:#1d6f42;--b:#b3541e;--ok:#2e9e4f;--no:#d63a36;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2a22;--card:#17402f;--fg:#eef6f1;--mu:#a9c4b5;--dk:#07160f;--ln:#2d5c47;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f2a22;--card:#17402f;--fg:#eef6f1;--mu:#a9c4b5;--dk:#07160f;--ln:#2d5c47;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:Calibri,"Segoe UI",system-ui,sans-serif;font-size:clamp(17px,1.9vw,26px)}
h1{font-family:Cambria,Georgia,serif;font-size:clamp(1.3rem,3vw,2.2rem);margin:0}
header{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.7rem 1.2rem;background:var(--dk);color:#fff}header .sp{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:.8rem;padding:.5rem 1.1rem;background:var(--gd);color:#0f2a22;font-weight:700}button.ghost{background:transparent;color:#fff;border:1px solid #fff}
button:focus-visible,input:focus-visible{outline:4px solid var(--gd);outline-offset:3px}
main{max-width:1150px;margin:0 auto;padding:1rem clamp(.8rem,3vw,2rem) 2rem}
.panel{background:var(--card);border:2px solid var(--ln);border-radius:1.2rem;padding:1.2rem;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}.names label{display:block;font-weight:700}.names input{font:inherit;width:100%;padding:.5rem;border-radius:.7rem;border:2px solid var(--ln);text-align:center;background:var(--bg);color:var(--fg)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:.8rem;align-items:center;margin-bottom:.6rem}
.sc{border-radius:1rem;padding:.5rem 1rem;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:4px solid transparent}.sc.A{background:var(--a)}.sc.B{background:var(--b)}
.sc.on{border-color:var(--gd);box-shadow:0 0 0 4px rgba(242,200,17,.4)}.sc b{font-size:1.8em;font-family:Cambria,Georgia,serif}.bump{animation:bump .5s}@keyframes bump{50%{transform:scale(1.4)}}
.mid{background:var(--dk);color:var(--gd);padding:.4rem .9rem;border-radius:.8rem;font-weight:700;text-align:center}
#arena{position:relative;height:clamp(220px,36vh,350px);border-radius:1.2rem;overflow:hidden;background:linear-gradient(#8fd3ff 0 62%,#e7c987 62% 100%);border:3px solid var(--dk)}
#arena .sun{position:absolute;top:8%;left:46%;font-size:2.4rem}#arena .cloud{position:absolute;top:10%;font-size:2.4rem;opacity:.9}
#pool{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:20%;height:20%;background:radial-gradient(#4a2a14,#2b1608);border-radius:50%;border:4px solid #7a4a28;display:grid;place-items:center;font-size:clamp(1.2rem,3vw,2.2rem)}
#pull{position:absolute;inset:0;transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
.char{position:absolute;bottom:20%;font-size:clamp(3.2rem,10vw,7rem);line-height:1;transition:transform .3s}.char.b{right:14%;transform:scaleX(-1)}.char.a{left:14%}
.char.pull{animation:wob .4s 2}@keyframes wob{25%{rotate:-8deg}75%{rotate:8deg}}.char.oops{animation:sh .4s}@keyframes sh{25%{translate:-8px 0}75%{translate:8px 0}}
.char.drop{animation:fall 1.4s forwards}@keyframes fall{to{translate:0 120%;rotate:200deg;opacity:0}}
#rope{position:absolute;left:25%;right:25%;top:56%;height:9px;background:repeating-linear-gradient(90deg,#9b6a2f 0 10px,#7a4f1f 10px 20px);border-radius:6px}
#flag{position:absolute;left:50%;top:-1.9rem;font-size:2rem;transform:translateX(-50%)}
.bub{position:absolute;top:6%;background:#fff;color:#222;border-radius:1rem;padding:.2rem .8rem;font-weight:700;opacity:0;transition:opacity .3s;font-size:.9em}.bub.on{opacity:1}#bA{left:4%}#bB{right:4%}
#splash{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-size:3rem;display:none}#splash.on{display:block;animation:bump .8s 2}
.q{margin-top:.8rem;text-align:center}.who{font-weight:700;font-size:1.2em}.tbar{height:.6rem;background:var(--ln);border-radius:1rem;overflow:hidden;margin:.5rem auto;max-width:520px}.tbar i{display:block;height:100%;width:100%;background:var(--gd)}
.qt{font-family:Cambria,Georgia,serif;font-size:1.5em;font-weight:700;margin:.4rem 0}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.7rem;max-width:760px;margin:.6rem auto}
.opts button{background:var(--card);color:var(--fg);border:3px solid var(--ln);padding:.8rem;font-size:1.05em}.opts .ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opts .no{background:var(--no);color:#fff;border-color:var(--no)}
.fb{min-height:1.6em;font-weight:700;text-align:center}
#end{position:fixed;inset:0;background:rgba(7,22,15,.88);display:none;place-items:center;z-index:20;padding:1rem}#end.on{display:grid}
.endc{background:var(--card);border:4px solid var(--gd);border-radius:1.4rem;padding:1.6rem 2rem;text-align:center;max-width:640px}.endc h2{font-family:Cambria,Georgia,serif;font-size:2em;margin:.2rem 0}
.cf{position:fixed;top:-2rem;font-size:1.6rem;animation:cf 3s linear forwards;z-index:30;pointer-events:none}@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){.names{grid-template-columns:1fr}.score{grid-template-columns:1fr 1fr}.mid{grid-column:1/-1;order:-1}}
</style></head><body>
<header><h1>Tug of War Quiz</h1><span class="sp"></span><button class="ghost" id="mt" aria-pressed="false">Sound on</button><button class="ghost" id="th">Theme</button><button class="ghost" id="rs">Restart</button></header>
<main>
<section class="panel" id="setup"><h2 style="font-family:Cambria,Georgia,serif;margin:.2rem">Two teams. One rope. One coffee pool!</h2>
<p>Teams take turns. Each correct answer pulls the rope your way. The team with more points wins, and the other team takes a swim in the coffee pool!</p>
<div class="names"><div><label for="nA">Team 1</label><input id="nA" value="Camels" maxlength="14"></div><div><label for="nB">Team 2</label><input id="nB" value="Falcons" maxlength="14"></div></div>
<button id="go" style="font-size:1.2em;padding:.7rem 2rem">Start the game</button></section>
<section id="game" hidden>
<div class="score"><div class="sc A on" id="cA"><span id="tA"></span><b id="sA">0</b></div><div class="mid" id="rd"></div><div class="sc B" id="cB"><b id="sB">0</b><span id="tB"></span></div></div>
<div id="arena" aria-label="Tug of war arena"><span class="sun">☀️</span><span class="cloud" style="left:12%">☁️</span><span class="cloud" style="left:72%">☁️</span>
<div id="pool">☕</div><div id="pull"><div class="bub" id="bA"></div><div class="bub" id="bB"></div><div class="char a" id="chA">🐪</div><div id="rope"><span id="flag">🚩</span></div><div class="char b" id="chB">🦅</div></div><div id="splash">💦 SPLASH! 💦</div></div>
<div class="q"><div class="who" id="who"></div><div class="tbar"><i id="tb"></i></div><div class="qt" id="qt"></div><div class="opts" id="opts"></div><p class="fb" id="fb" aria-live="polite"></p></div></section>
</main>
<div id="end"><div class="endc"><div style="font-size:4rem" id="ee"></div><h2 id="eh"></h2><p id="ep"></p><button id="again" style="font-size:1.1em">Play again</button></div></div>
<script>
const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);
$('th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme=='dark';r.dataset.theme=d?'light':'dark'};
let mute=false;$('mt').onclick=()=>{mute=!mute;$('mt').textContent=mute?'Sound off':'Sound on';$('mt').setAttribute('aria-pressed',mute)};
let ac;function beep(f,d=.15,t='sine'){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const QA=[['Which data type is 00125?','Text','Number','Date'],['What does =B2*C2 do?','Multiplies the cells','Adds the cells','Divides the cells'],['Which function finds the biggest number?','MAX','MIN','SUM'],['Which data type is TRUE?','Boolean','Text','Currency'],['What does =10-4 give?','6','14','40'],['What is the AVERAGE of 2, 4, 6?','4','12','6']];
const QB=[['Which data type is 25%?','Percentage','Text','Date'],['Which symbol divides in Excel?','/','*','+'],['Which function finds the smallest number?','MIN','MAX','SUM'],['Which data type is 2026-10-25?','Date / Time','Boolean','Number'],['What does =3+9 give?','12','27','6'],['What is the SUM of 4, 8, 6, 2, 10?','30','20','10']];
const QT=[['What must every formula start with?','=','#','$'],['Which type keeps the zeros of an ID like 00125?','Text','Number','Boolean'],['What does SUM do?','Adds numbers','Finds the biggest','Finds the smallest'],['SUM gives 0 on numbers typed as text. Why?','SUM ignores text','Excel is broken','The numbers are too big']];
const FUN={A:['Heave-ho!','Pull, pull!','Dates power!','Coffee break later!'],B:['Is that all?','My arms!','Fly higher!','Smells like coffee...']};
let sA,sB,ai,bi,ti,turn,n,sudden,locked,tmr,left;const MAXD=5;
const names=()=>[$('nA').value.trim()||'Camels',$('nB').value.trim()||'Falcons'];
function start(){const[a,b]=names();$('tA').textContent='🐪 '+a;$('tB').textContent=b+' 🦅';sA=sB=ai=bi=ti=n=0;turn='A';sudden=false;locked=false;
 $('setup').hidden=true;$('game').hidden=false;$('end').classList.remove('on');$('sA').textContent=0;$('sB').textContent=0;$('chA').className='char a';$('chB').className='char b';$('splash').classList.remove('on');rope();next()}
function rope(){const s=Math.max(-MAXD,Math.min(MAXD,sB-sA))*4;$('pull').style.transform='translateX('+s+'%)'}
function bubble(t,txt){const e=$('b'+t);e.textContent=txt;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1300)}
function next(){const nm=names();$('cA').classList.toggle('on',turn=='A');$('cB').classList.toggle('on',turn=='B');
 const q=sudden?QT[ti%QT.length]:(turn=='A'?QA[ai]:QB[bi]);$('rd').textContent=sudden?'Sudden death!':'Question '+(n+1)+' of 12';
 $('who').textContent=(turn=='A'?'🐪 ':'🦅 ')+(turn=='A'?nm[0]:nm[1])+', your question!';$('qt').textContent=q[0];$('fb').textContent='';$('fb').className='fb';locked=false;
 $('opts').innerHTML='';shuffle(q.slice(1)).forEach((t,k)=>{const b=document.createElement('button');b.textContent=(k+1)+'. '+t;b.dataset.c=t==q[1]?1:0;b.onclick=()=>answer(b,t==q[1]);$('opts').appendChild(b)});
 left=20;clearInterval(tmr);$('tb').style.width='100%';tmr=setInterval(()=>{left-=.2;$('tb').style.width=Math.max(0,left/20*100)+'%';if(left<=0){clearInterval(tmr);answer(null,false)}},200)}
function answer(b,ok){if(locked)return;locked=true;clearInterval(tmr);const t=turn;document.querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.c==1)x.classList.add('ok')});
 const ch=$('ch'+t),fb=$('fb');
 if(ok){beep(660);beep(880,.2);if(t=='A'){sA++;$('sA').textContent=sA;$('sA').classList.add('bump')}else{sB++;$('sB').textContent=sB;$('sB').classList.add('bump')}
  setTimeout(()=>{$('sA').classList.remove('bump');$('sB').classList.remove('bump')},600);ch.classList.remove('pull');void ch.offsetWidth;ch.classList.add('pull');bubble(t,FUN[t][Math.floor(Math.random()*4)]);fb.textContent='Correct! Pull the rope!';fb.className='fb';fb.style.color='var(--ok)'}
 else{beep(180,.3,'sawtooth');if(b)b.classList.add('no');ch.classList.remove('oops');void ch.offsetWidth;ch.classList.add('oops');bubble(t,'Oops! 😅');fb.textContent=b?'Not quite. The green answer is correct.':"Time's up!";fb.style.color='var(--no)'}
 rope();if(sudden)ti++;else if(t=='A')ai++;else bi++;if(!sudden)n=ai+bi;
 setTimeout(()=>{const d=Math.abs(sA-sB);
  if(d>=MAXD)return finish('KO');
  if(!sudden&&n>=12){if(sA!=sB)return finish('points');sudden=true;turn='A';return next()}
  if(sudden&&t=='B'){if(sA!=sB)return finish('points');if(ti>=QT.length)return finish('draw')}
  turn=t=='A'?'B':'A';next()},1700)}
function finish(how){clearInterval(tmr);const nm=names();let w=sA>sB?'A':sB>sA?'B':null;
 if(w){const l=w=='A'?'B':'A';$('pull').style.transform='translateX('+(w=="A"?-20:20)+'%)';$('ch'+l).classList.add('drop');$('splash').classList.add('on');beep(300,.4,'triangle')}
 setTimeout(()=>{$('end').classList.add('on');
  if(w){const wn=w=='A'?nm[0]:nm[1],ln=w=='A'?nm[1]:nm[0];$('ee').textContent=w=='A'?'🐪🏆':'🦅🏆';$('eh').textContent=wn+' win!';$('ep').textContent=(how=='KO'?'Knockout! ':'')+sA+' : '+sB+'. '+ln+' took a swim in the coffee pool! ☕💦';party()}
  else{$('ee').textContent='🤝';$('eh').textContent="It's a draw!";$('ep').textContent='Both teams pulled with equal power ('+sA+' : '+sB+'). Everyone gets dates!'}},w?2200:600)}
function party(){beep(523,.15);setTimeout(()=>beep(659,.15),160);setTimeout(()=>beep(784,.3),320);for(let i=0;i<50;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🎉','⭐','🎊','☕','🌴'][i%5];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
$('go').onclick=start;$('again').onclick=start;$('rs').onclick=()=>{clearInterval(tmr);$('end').classList.remove('on');$('game').hidden=true;$('setup').hidden=false};
document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){const b=document.querySelectorAll('.opts button')[+e.key-1];if(b&&!b.disabled&&!['INPUT'].includes(e.target.tagName))b.click()}});
</script></body></html>
